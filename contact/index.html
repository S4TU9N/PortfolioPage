<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div class="bg"></div>

    <div class="page">

        <nav>
            <div class="brand">
                <img src="/assets/images/profile.png" class="profile-pic">
                <span>Mouse</span>
            </div>

            <ul class="nav-links">
                <li><a href="/home/">Home</a></li>
                <li><a href="/projects/">Projects</a></li>
                <li><a href="/contact/">Contact</a></li>
            </ul>
        </nav>

        <main class="contact-page">

            <h1 class="page-title">Contact</h1>
            <div class="contact-grid">
                <a class="contact-card" href="https://github.com/S4TU9N" target="_blank" rel="noopener noreferrer">
                    <img
                        src="../assets/icons/github.svg"
                        alt="GitHub"
                        class="contact-icon">
                    <h2>GitHub</h2>

                </a>
                <a class="contact-card" href="https://modrinth.com/user/qsecYC3v" target="_blank" rel="noopener noreferrer">
                    <img
                        src="../assets/icons/modrinth.svg"
                        alt="Modrinth"
                        class="contact-icon">
                    <h2>Modrinth</h2>
                </a>
                <a class="contact-card" href="https://discord.com/users/853277498019807272" target="_blank" rel="noopener noreferrer">
                    <img
                        src="../assets/icons/discord.svg"
                        alt="Discord"
                        class="contact-icon">
                    <h2>Discord</h2>
                </a>
            </div>
            <div class="feedback-section">

                <p class="feedback-text">
                    Have feedback, found a bug, or have an idea for a plugin?
                </p>

                <a class="feedback-button"
                    class="primary"
                    href="https://forms.gle/GhB6a8PsjkeLqU5SA"
                    target="_blank"
                    rel="noopener noreferrer">

                    Send Feedback

                </a>

            </div>
        </main>

    </div>
</body>
</html>
